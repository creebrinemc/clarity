[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity-lang"
version = "0.4.0"
description = "The Clarity programming language prototype"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clarity = "clarity.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
